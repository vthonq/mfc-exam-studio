<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mfc_studio_settings_v1');
          var s = raw ? JSON.parse(raw) : null;
          var valid = { obsidian: 1, paper: 1, forest: 1, indigo: 1 };
          var p = s && valid[s.palette] ? s.palette : s && s.theme === 'light' ? 'paper' : 'obsidian';
          var colors = { obsidian: '#09090b', paper: '#faf8f5', forest: '#06110e', indigo: '#070a19' };
          var root = document.documentElement;
          root.dataset.palette = p;
          root.classList.toggle('dark', p !== 'paper');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && colors[p]) meta.setAttribute('content', colors[p]);
        } catch (e) {}
      })();
    </script>
    <title>Exam Studio Hub — MFC · Economics · Prob &amp; Stat</title>
    <link rel="icon" type="image/png" href="./logo.png?v=51" />
    <link rel="apple-touch-icon" href="./logo.png?v=51" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 selection:bg-indigo-500/25 selection:text-indigo-950 dark:selection:text-indigo-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
